<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in · Datacenter & Power Intelligence</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 36px 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      text-align: center;
      box-sizing: border-box;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      margin-bottom: 18px;
    }
    .badge svg { display: block; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0 0 4px;
      color: white;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin: 0 0 24px;
    }
    .status {
      font-size: 14px;
      color: #cbd5e1;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn svg { display: block; flex-shrink: 0; }
    .btn:hover { box-shadow: 0 6px 18px rgba(59,130,246,0.35); }
    .btn:active { transform: translateY(1px); }
    .footnote {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="badge" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </span>
      <h1>Datacenter &amp; Power Intelligence</h1>
      <p class="subtitle">OCI Strategic Platform</p>
      <p class="status">You've been signed out.</p>
      <a class="btn" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>Sign in with Oracle SSO</span>
      </a>
      <p class="footnote">If your Oracle SSO session is still active, signing in returns you immediately. To switch users, also sign out of OCI Console or open an incognito window.</p>
    </div>
  </div>
</body>
</html>
