# Generated by certbot + augmented with oauth2-proxy auth_request gate

server {
    server_name datacenter.oci-incubations.com;

    # ===== oauth2-proxy endpoints =====

    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri  $request_uri;

        # OCI Identity Domain ID tokens are large -> session cookies split
        # across multiple Set-Cookie headers; bump buffers so nginx can hold them.
        proxy_buffer_size       16k;
        proxy_buffers           8  16k;
        proxy_busy_buffers_size 32k;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_pass_request_body off;
        proxy_set_header  Content-Length  "";

        proxy_buffer_size       16k;
        proxy_buffers           8  16k;
        proxy_busy_buffers_size 32k;
    }

    # ===== public sign-in landing (NOT behind auth gate) =====
    location = /signin {
        root /var/www/datacenter;
        try_files /signin.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location @oauth2_signin {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
    }

    # ===== protected: backend API =====
    location /api/ {
        auth_request        /oauth2/auth;
        error_page 401 =    @oauth2_signin;
        auth_request_set $email $upstream_http_x_auth_request_email;
        auth_request_set $user  $upstream_http_x_auth_request_user;

        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Email $email;
        proxy_set_header X-Forwarded-User  $user;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ===== protected: Swagger / OpenAPI =====
    location /docs {
        auth_request        /oauth2/auth;
        error_page 401 =    @oauth2_signin;

        proxy_pass http://127.0.0.1:8002/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        auth_request        /oauth2/auth;
        error_page 401 =    @oauth2_signin;

        proxy_pass http://127.0.0.1:8002/openapi.json;
        proxy_set_header Host $host;
    }

    # ===== protected: frontend (Vite dev server) =====
    location / {
        auth_request        /oauth2/auth;
        error_page 401 =    @oauth2_signin;
        auth_request_set $email $upstream_http_x_auth_request_email;
        auth_request_set $user  $upstream_http_x_auth_request_user;

        proxy_pass http://127.0.0.1:5174/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Email $email;
        proxy_set_header X-Forwarded-User  $user;

        # Large request headers (multi-chunk session cookies from OCI ID tokens)
        proxy_buffer_size       16k;
        proxy_buffers           8  16k;
        proxy_busy_buffers_size 32k;

        # WebSocket support (Vite HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Allow large request headers globally for this vhost (multi-chunk cookies).
    large_client_header_buffers 8 16k;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datacenter.oci-incubations.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datacenter.oci-incubations.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = datacenter.oci-incubations.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name datacenter.oci-incubations.com;
    return 404; # managed by Certbot
}
