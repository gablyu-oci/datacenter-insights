[project]
name = "strategic-insights-backend"
version = "0.1.0"
description = "Backend for the Strategic Insights Tool — hyperscaler competitive intelligence platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "polars>=1.0.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.11.0",
    "httpx>=0.28.0",
    "stamina>=24.3.0",
    "apscheduler>=3.11.0",
    "python-dotenv>=1.1.0",
    "pydantic-settings>=2.8.0",
    "openai>=1.60.0",
    "edgartools>=3.0.0",
    # Phase 1.5 -- PDF generator-permit parser (pdf_parser.py)
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "anthropic>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
